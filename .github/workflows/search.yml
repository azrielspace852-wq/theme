name: AXION Search Service

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Kata kunci pencarian'
        required: true
        default: 'Axion AI'
      max_results:
        description: 'Jumlah hasil maksimal (1-10)'
        required: false
        default: '5'

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Search
        run: node search.js "${{ github.event.inputs.query }}"
